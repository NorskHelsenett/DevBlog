# Note that many of these secrets have been previously created in the keycloak setup deployment
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: create-kafka-broker-client-secret
  namespace: kafka # where you want the new secret
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: css-eso-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: kafka-broker-client
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        client-id: 'kafka-broker'
        client-secret: '{{ .retrievedpassword }}' # Helm escaped variant: '{{"{{ .retrievedpassword }}"}}'
  data:
    - secretKey: retrievedpassword # Key used for lookup in templating above in target section
      remoteRef:
        key: keycloak-kafka-broker-client-pushed-secret
        property: keycloak-kafka-broker-client-secret-value
---
