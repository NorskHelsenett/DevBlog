apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: create-kafbat-ui-sals-jaas-connection-config-secret
  namespace: kafka # where you want the new secret
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: css-eso-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: kafbat-ui-sals-jaas-connection-config-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        sasl-jaas-config: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.valid.issuer.uri="http://keycloak.localho.st:8080/realms/kafka" oauth.jwks.endpoint.uri="http://keycloak.keycloak.svc.cluster.local:8080/realms/kafka/protocol/openid-connect/certs" clientId=kafka-broker scope='openid' clientSecret={{ .retrievedpassword }};
        # '{{ .retrievedpassword }}' # Helm escaped variant: '{{"{{ .retrievedpassword }}"}}'
  data:
    - secretKey: retrievedpassword # Key used for lookup in templating above in target section
      remoteRef:
        key: keycloak-kafka-broker-client-pushed-secret
        property: keycloak-kafka-broker-client-secret-value
