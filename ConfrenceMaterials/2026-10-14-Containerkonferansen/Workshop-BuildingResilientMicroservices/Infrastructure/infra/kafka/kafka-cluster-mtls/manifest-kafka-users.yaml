#   #         patternType: literal
#   #       operations:
#   #         - ALL
#   #       host: "*"
#   #     # Allow reading from topics
#   #     - resource:
#   #         type: topic
#   #         name: "*"
#   #         patternType: literal
#   #       operations:
#   #         - ALL
#   #       host: "*"
