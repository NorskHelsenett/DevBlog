apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: create-cluster-1-truststore
  namespace: workshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: css-eso-kafka-store
    kind: ClusterSecretStore
  target:
    name: cluster-1-truststore
    creationPolicy: Owner
  dataFrom:
    - extract:
        # The name of the source secret in the `kafka` namespace
        key: ws-kafka-cluster-mtls-trustbundle
        # leaving `property` empty copies all keys; you can specify a single key if you only need one.
        property: ""
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: create-cluster-1-topic-copier-user-secret
  namespace: workshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: css-eso-kafka-store
    kind: ClusterSecretStore
  target:
    name: cluster-1-topic-copier-user-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        # The name of the source secret in the `kafka` namespace
        key: ws-kafka-cluster-mtls-superuser
        # leaving `property` empty copies all keys; you can specify a single key if you only need one.
        property: ""
---
