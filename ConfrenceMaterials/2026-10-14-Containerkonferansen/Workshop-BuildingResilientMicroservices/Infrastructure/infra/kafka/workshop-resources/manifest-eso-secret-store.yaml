apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: css-eso-kafka-store
spec:
  provider:
    kubernetes:
      # Because we are copying from the kafka namespace
      remoteNamespace: kafka
      # Existing ESO SA has cluster-wide access to everything, so we can re-use it
      auth:
        serviceAccount:
          name: sa-external-secrets-in-cluster-store
          namespace: ns-external-secrets-service-account
      server:
        # Default in‑cluster API server URL
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: ns-external-secrets-service-account
          key: ca.crt
