apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: ws-kafka-cluster-mtls-superuser
  namespace: kafka
  labels:
    strimzi.io/cluster: ws-kafka-cluster-mtls
spec:
  # mTLS authentication - generates client certificates
  authentication:
    type: tls
    validityDays: 360
    renewalDays: 30
  # ACL authorization for the client
  # authorization:
  #   type: simple
  #   acls:
  #     # Allow consumer group operations
  #     - resource:
  #         type: group
  #         name: "*"
  #         patternType: literal
  #       operations:
  #         - ALL
  #       host: "*"
  #     # Allow reading from topics
  #     - resource:
  #         type: topic
  #         name: "*"
  #         patternType: literal
  #       operations:
  #         - ALL
  #       host: "*"
  #     # Allow writing to topics
  #     - resource:
  #         type: topic
  #         name: "*"
  #         patternType: literal
  #       operations:
  #         - ALL
  #       host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: ws-kafka-cluster-second-superuser
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster-mtls-second
spec:
  # mTLS authentication - generates client certificates
  authentication:
    type: tls
    validityDays: 360
    renewalDays: 30
