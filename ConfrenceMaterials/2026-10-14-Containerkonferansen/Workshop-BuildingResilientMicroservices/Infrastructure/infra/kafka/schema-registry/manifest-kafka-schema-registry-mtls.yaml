apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schema-registry-storage-events
  namespace: kafka
  labels:
    strimzi.io/cluster: ws-kafka-cluster-mtls
spec:
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: -1
    retention.bytes: -1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schema-registry-storage-snapshots
  namespace: kafka
  labels:
    strimzi.io/cluster: ws-kafka-cluster-mtls
spec:
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: -1
    retention.bytes: -1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schema-registry-storage-journal
  namespace: kafka
  labels:
    strimzi.io/cluster: ws-kafka-cluster-mtls
spec:
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: -1
    retention.bytes: -1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: schema-registry-user
  namespace: kafka
  labels:
    strimzi.io/cluster: ws-kafka-cluster-mtls
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Consumer Acls for topics schema-registry-* using consumer groups schema-registry-*
      - resource:
          type: topic
          name: schema-registry-
          patternType: prefix
        operations:
          - All
        host: "*"
      - resource:
          type: group
          name: schema-registry-
          patternType: prefix
        operations:
          - All
        host: "*"
      # Producer Acls for topic schema-registry-*
      - resource:
          type: topic
          name: schema-registry-
          patternType: prefix
        operations:
          - All
        host: "*"
---
apiVersion: access.strimzi.io/v1alpha1
kind: KafkaAccess
metadata:
  name: kafka-access-schema-registry
  namespace: kafka
  # labels:
  #   strimzi.io/cluster: ws-kafka-cluster-mtls
spec:
  kafka:
    name: ws-kafka-cluster-mtls
    namespace: kafka
    listener: tls
  user:
    kind: KafkaUser
    apiGroup: kafka.strimzi.io
    namespace: kafka
    name: schema-registry-user
---
apiVersion: registry.apicur.io/v1
kind: ApicurioRegistry3
metadata:
  name: schema-registry
  namespace: kafka
spec:
  app:
    podTemplateSpec:
      metadata:
        labels:
          app: schema-registry
        # annotations:
        #   example.com/owner: my-team
    storage:
      type: kafkasql
      kafkasql:
        # kafkaAccessSecretName: kafka-access-schema-registry
        bootstrapServers: "ws-kafka-cluster-mtls-kafka-bootstrap.kafka.svc.cluster.local:9093"
        tls:
          # The need to use this truststore for the p12 file is sketchy as fuck, I think it gives the access to issue their own certs. They should have used the cluster-ca.crt file from the ws-kafka-cluster-mtls-trustbundle secret instead.
          truststoreSecretRef:
            name: "ws-kafka-cluster-mtls-cluster-ca-cert"
            key: "ca.p12"
          truststorePasswordSecretRef:
            name: "ws-kafka-cluster-mtls-cluster-ca-cert"
            key: "ca.password"
          keystoreSecretRef:
            name: "schema-registry-user"
            key: "user.p12"
          keystorePasswordSecretRef:
            name: "schema-registry-user"
            key: "user.password"
    ingress:
      host: registry.example.com
    env:
      - name: APICURIO_EVENTS_KAFKA_TOPIC
        value: schema-registry-storage-events
      - name: APICURIO_KAFKASQL_SNAPSHOTS_TOPIC
        value: schema-registry-storage-snapshots
      - name: APICURIO_KAFKASQL_TOPIC
        value: schema-registry-storage-journal
      - name: APICURIO_KAFKASQL_CONSUMER_GROUP_PREFIX
        value: schema-registry-
