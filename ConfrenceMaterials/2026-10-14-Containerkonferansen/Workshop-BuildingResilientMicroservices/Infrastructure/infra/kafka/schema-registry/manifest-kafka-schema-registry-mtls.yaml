apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hr-schema-registry
  namespace: kafka
spec:
  parentRefs:
  - name: ourgateway
    namespace: networking-gateway
    kind: Gateway
  hostnames:
  - schema-registry.localhost.nhn.no
  - schema-registry.localho.st
  rules:
  - backendRefs:
    - name: schema-registry-app-service
      port: 8080
