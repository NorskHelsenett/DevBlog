apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hr-workshop-api
  namespace: kafka
spec:
  parentRefs:
  - name: ourgateway
    namespace: networking-gateway
    kind: Gateway
  hostnames:
  - workshop-api.localhost.nhn.no
  - workshop-api.localho.st
  rules:
  - backendRefs:
    - name: workshop-api-app-service
      port: 8080
