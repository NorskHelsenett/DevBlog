apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hr-workshop-api
  namespace: kafka
spec:
  parentRefs:
  - name: ourgateway
    namespace: networking-gateway
    kind: Gateway
  hostnames:
  - workshop-api.localhost.nhn.no
  - workshop-api.localho.st
  rules:
  - backendRefs:
    - name: workshop-api-app-service
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: workshop-api-instance-a1
  namespace: {{ .Values.resilientMicroservice.namespace | quote }}
  labels:
    app.kubernetes.io/name: workshop-api
    app.kubernetes.io/instance: workshop-api-instance-a1
spec:
  selector:
    app.kubernetes.io/name: workshop-api
    app.kubernetes.io/instance: workshop-api-instance-a1
  ports:
    - name: http
      protocol: TCP
      port: 8080           # the Service port (what callers use)
      targetPort: 8080     # the container port defined in the Deployment
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workshop-api-httproute
  namespace: {{ .Values.resilientMicroservice.namespace | quote }}
spec:
  parentRefs:
    - name: ourgateway
      namespace: networking-gateway
      kind: Gateway
  hostnames:
    - workshop-api-a1.localhost.nhn.no
    - workshop-api-a1.localho.st
  rules:
    - backendRefs:
        - name: workshop-api-instance-a1
          port: 8080
